<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Chart Icon -->
  <g filter="url(#shadow)">
    <!-- Base line -->
    <rect x="96" y="376" width="320" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.9"/>
    <!-- Bar 1 -->
    <rect x="128" y="240" width="56" height="128" rx="14" fill="#FFFFFF" fill-opacity="0.8"/>
    <!-- Bar 2 -->
    <rect x="228" y="160" width="56" height="208" rx="14" fill="#FFFFFF"/>
    <!-- Bar 3 -->

    <!-- Growth Line -->
    <path d="M156 210 L256 130 L356 160" fill="none" stroke="#FDE047" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="156" cy="210" r="12" fill="#FDE047"/>
    <circle cx="256" cy="130" r="14" fill="#FDE047"/>
    <circle cx="356" cy="160" r="12" fill="#FDE047"/>
